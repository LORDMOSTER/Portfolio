<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Deep dark background with rounded corners -->
  <rect width="100" height="100" rx="22" fill="#050505" />
  
  <!-- Minimalist thin gold border -->
  <rect x="6" y="6" width="88" height="88" rx="16" fill="none" stroke="#D4AF37" stroke-width="1.5" opacity="0.5" />
  
  <!-- Clean, tech-aesthetic monospace text -->
  <text x="52" y="66" 
        font-family="'Courier New', Courier, monospace" 
        font-size="46" 
        font-weight="bold" 
        fill="#D4AF37" 
        text-anchor="middle" 
        letter-spacing="-1">S.</text>
</svg>
