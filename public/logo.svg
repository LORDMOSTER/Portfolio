<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEA75" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8B6914" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="120" fill="#0A0A0A" />
  
  <text x="256" y="350" font-family="'Courier New', Courier, monospace" font-size="280" font-weight="900" fill="url(#gold)" text-anchor="middle" letter-spacing="-10" filter="url(#glow)">SP</text>
  <text x="256" y="350" font-family="'Courier New', Courier, monospace" font-size="280" font-weight="900" fill="#FFF" text-anchor="middle" letter-spacing="-10" opacity="0.9">SP</text>
</svg>
