<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Ultra Glossy Gold Gradient -->
    <linearGradient id="glossyGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#AA7700" />
      <stop offset="35%" stop-color="#FDE08B" />
      <!-- Sharp glossy highlight -->
      <stop offset="45%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#FFF3C7" />
      <stop offset="60%" stop-color="#D4AF37" />
      <stop offset="85%" stop-color="#9A6E00" />
      <stop offset="100%" stop-color="#4A3500" />
    </linearGradient>

    <!-- Metallic Rim Highlight -->
    <linearGradient id="goldRim" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5C158" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>

    <!-- Segmented Tech 'S' -->
    <g id="s-shape">
      <rect x="26" y="21" width="48" height="11" rx="2" />
      <rect x="26" y="34" width="13" height="11" rx="2" />
      <rect x="26" y="47" width="48" height="11" rx="2" />
      <rect x="61" y="60" width="13" height="11" rx="2" />
      <rect x="26" y="73" width="48" height="11" rx="2" />
    </g>

    <!-- Mask to punch the S out of the Hexagon -->
    <mask id="s-mask">
      <rect width="100" height="100" fill="white" />
      <use href="#s-shape" fill="black" />
    </mask>
  </defs>

  <!-- Deep dark base so the negative space 'S' is perfectly visible -->
  <polygon points="94,50 72,88.1 28,88.1 6,50 28,11.9 72,11.9" fill="#0A0A0A" />

  <!-- The high-gloss gold core, masked by the S -->
  <polygon points="94,50 72,88.1 28,88.1 6,50 28,11.9 72,11.9" fill="url(#glossyGold)" mask="url(#s-mask)" />
  
  <!-- Bright metallic inner border for the hexagon -->
  <polygon points="94,50 72,88.1 28,88.1 6,50 28,11.9 72,11.9" fill="none" stroke="url(#goldRim)" stroke-width="1.5" stroke-opacity="0.9" mask="url(#s-mask)" />

  <!-- Delicate bright stroke to highlight the cut-out 'S' edges -->
  <use href="#s-shape" fill="none" stroke="url(#goldRim)" stroke-width="1" stroke-opacity="0.9" />
  
  <!-- Outer glowing wireframe HUD ring -->
  <polygon points="98,50 74,91.6 26,91.6 2,50 26,8.4 74,8.4" fill="none" stroke="url(#glossyGold)" stroke-width="1.5" stroke-opacity="0.8" />
</svg>
