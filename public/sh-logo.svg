<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE770" />
      <stop offset="30%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA8222" />
      <stop offset="100%" stop-color="#FFD700" />
    </linearGradient>
    <filter id="superGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="110" fill="#0A0A0A" />
  
  <!-- Glowing Base -->
  <text x="256" y="385" 
        font-family="'Arial Black', Impact, sans-serif" 
        font-size="360" 
        font-weight="900" 
        fill="url(#gold)" 
        text-anchor="middle" 
        letter-spacing="-15" 
        filter="url(#superGlow)">SH</text>
        
  <!-- Crisp, Bright Top Layer -->
  <text x="256" y="385" 
        font-family="'Arial Black', Impact, sans-serif" 
        font-size="360" 
        font-weight="900" 
        fill="#FFF6D9" 
        text-anchor="middle" 
        letter-spacing="-15" 
        opacity="0.95">SH</text>
</svg>
